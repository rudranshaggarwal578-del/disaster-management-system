{% extends "base.html" %}

{% block title %}Report Disaster{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Report a Disaster
                </h2>

                <p class="text-muted">
                    Provide accurate information about the disaster.
                </p>


                <form method="POST"
                      action="/report-disaster"
                      enctype="multipart/form-data">


                    <!-- Disaster Type -->

                    <div class="mb-3">

                        <label class="form-label">
                            Disaster Type
                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required>

                            <option value="">
                                Select disaster type
                            </option>

                            <option value="Flood">
                                Flood
                            </option>

                            <option value="Earthquake">
                                Earthquake
                            </option>

                            <option value="Fire">
                                Fire
                            </option>

                            <option value="Landslide">
                                Landslide
                            </option>

                            <option value="Cyclone">
                                Cyclone
                            </option>

                            <option value="Storm">
                                Storm
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Description -->

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Describe what happened..."
                            required>
                        </textarea>

                    </div>


                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Select Disaster Location on Map
                        </label>

                        <div id="reportMap"
                            style="height: 400px;
                            width: 100%;
                            border-radius: 10px;
                            border: 1px solid #ccc;">
                        </div>

                        <small class="text-muted d-block mt-2">
                            Click on the map to select the disaster location.
                            You can drag the marker to adjust it.
                        </small>
                        
                        <p id="selectedCoordinates" class="mt-2">
                            No location selected.
                        </p>
                    

                    </div>


                    <!-- Location Name -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location Name or Landmark
                        </label>

                        <input
                            type="text"
                            name="location"
                            id="location"
                            class="form-control"
                            placeholder="Enter village, city, road, or landmark"
                            required
                        >

                    </div>


                    <!-- Hidden coordinate -->

                    <div class="mb-3">

                        <input
                            type="hidden"
                            name="latitude"
                            id="latitude"
                            required
                        >
                        
                        <input
                            type="hidden"
                            name="longitude"
                            id="longitude"
                            required
                        >

                    </div>


                    <!-- Image -->

                    <div class="mb-3">

                        <label class="form-label">
                            Upload Image
                        </label>

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>
                    


                    <button
                        type="submit"
                        class="btn btn-danger">

                        Submit Disaster Report

                    </button>


                    <a
                        href="/"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {

    // Create the map
    const reportMap = L.map("reportMap").setView(
        [30.7333, 76.7794],
        7
    );

    // Add OpenStreetMap tiles
    L.tileLayer(
        "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
        {
            attribution: "&copy; OpenStreetMap contributors",
            maxZoom: 19
        }
    ).addTo(reportMap);

    let selectedMarker = null;

    const latitudeInput =
        document.getElementById("latitude");

    const longitudeInput =
        document.getElementById("longitude");

    const coordinatesDisplay =
        document.getElementById("selectedCoordinates");

    // Update coordinates when the user selects a point
    function updateSelectedLocation(lat, lng) {

        latitudeInput.value = lat.toFixed(7);
        longitudeInput.value = lng.toFixed(7);

        coordinatesDisplay.textContent =
            "Selected coordinates: " +
            lat.toFixed(6) + ", " +
            lng.toFixed(6);
    }

    // Create or move the marker
    function placeMarker(latlng) {

        if (selectedMarker) {

            selectedMarker.setLatLng(latlng);

        } else {

            selectedMarker = L.marker(latlng, {
                draggable: true
            }).addTo(reportMap);

            // Update coordinates when marker is dragged
            selectedMarker.on("dragend", function (event) {

                const position =
                    event.target.getLatLng();

                updateSelectedLocation(
                    position.lat,
                    position.lng
                );

            });
        }

        updateSelectedLocation(
            latlng.lat,
            latlng.lng
        );
    }

    // User clicks anywhere on the map
    reportMap.on("click", function (event) {

        placeMarker(event.latlng);

    });

    // Ensure the map renders correctly
    setTimeout(function () {
        reportMap.invalidateSize();
    }, 200);

    const reportForm = document.querySelector(
    'form[action="/report-disaster"]'
);

reportForm.addEventListener("submit", function (event) {

    if (
        latitudeInput.value === "" ||
        longitudeInput.value === ""
    ) {

        event.preventDefault();

        alert(
            "Please select the disaster location on the map."
        );

        document.getElementById("reportMap").scrollIntoView({
            behavior: "smooth",
            block: "center"
        });
    }

});  

});
</script>

{% endblock %}

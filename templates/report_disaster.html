{% extends "base.html" %}

{% block title %}Report Disaster{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="mb-4">
                    Report a Disaster
                </h2>

                <p class="text-muted">
                    Provide accurate information about the disaster.
                </p>


                <form method="POST"
                      action="/report-disaster"
                      enctype="multipart/form-data">


                    <!-- Disaster Type -->

                    <div class="mb-3">

                        <label class="form-label">
                            Disaster Type
                        </label>

                        <select
                            name="type"
                            class="form-select"
                            required>

                            <option value="">
                                Select disaster type
                            </option>

                            <option value="Flood">
                                Flood
                            </option>

                            <option value="Earthquake">
                                Earthquake
                            </option>

                            <option value="Fire">
                                Fire
                            </option>

                            <option value="Landslide">
                                Landslide
                            </option>

                            <option value="Cyclone">
                                Cyclone
                            </option>

                            <option value="Storm">
                                Storm
                            </option>

                            <option value="Other">
                                Other
                            </option>

                        </select>

                    </div>


                    <!-- Description -->

                    <div class="mb-3">

                        <label class="form-label">
                            Description
                        </label>

                        <textarea
                            name="description"
                            class="form-control"
                            rows="5"
                            placeholder="Describe what happened..."
                            required>
                        </textarea>

                    </div>


                    <!-- Location -->

                    <div class="mb-3">

                        <label class="form-label">
                            Location
                        </label>

                        <input
                            type="text"
                            name="location"
                            class="form-control"
                            placeholder="Enter location"
                            required
                        >

                    </div>


                    <!-- Latitude -->

                    <div class="mb-3">

                        <label class="form-label">
                            Latitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            name="latitude"
                            class="form-control"
                            placeholder="Example: 29.9457"
                        >

                    </div>


                    <!-- Longitude -->

                    <div class="mb-3">

                        <label class="form-label">
                            Longitude
                        </label>

                        <input
                            type="number"
                            step="any"
                            name="longitude"
                            class="form-control"
                            placeholder="Example: 78.1642"
                        >

                    </div>


                    <!-- Image -->

                    <div class="mb-3">

                        <label class="form-label">
                            Upload Image
                        </label>

                        <input
                            type="file"
                            name="image"
                            class="form-control"
                            accept="image/*"
                        >

                    </div>


                    <button
                        type="submit"
                        class="btn btn-danger">

                        Submit Disaster Report

                    </button>


                    <a
                        href="/"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </form>

            </div>

        </div>

    </div>

</div>

{% endblock %}

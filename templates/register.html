{% extends "base.html" %}

{% block title %}Register - Disaster Management System{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card shadow">

            <div class="card-body p-4">

                <h2 class="text-center mb-4">
                    Create Account
                </h2>

                <form method="POST" action="/register">

                    <!-- Name -->
                    <div class="mb-3">

                        <label class="form-label">
                            Full Name
                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            placeholder="Enter your name"
                            required
                        >

                    </div>


                    <!-- Email -->
                    <div class="mb-3">

                        <label class="form-label">
                            Email
                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            placeholder="Enter your email"
                            required
                        >

                    </div>


                    <!-- Phone -->
                    <div class="mb-3">

                        <label class="form-label">
                            Phone Number
                        </label>

                        <input
                            type="tel"
                            name="phone"
                            class="form-control"
                            placeholder="Enter phone number"
                            required
                        >

                    </div>


                    <!-- Password -->
                    <div class="mb-3">

                        <label class="form-label">
                            Password
                        </label>

                        <input
                            type="password"
                            name="password"
                            class="form-control"
                            placeholder="Create password"
                            required
                        >

                    </div>


                    <!-- Role -->
                    <div class="mb-3">

                        <label class="form-label">
                            Account Type
                        </label>

                        <select
                            name="role"
                            class="form-select"
                            required>

                            <option value="">
                                Select account type
                            </option>

                            <option value="USER">
                                Citizen
                            </option>

                            <option value="VOLUNTEER">
                                Volunteer
                            </option>

                        </select>

                    </div>


                    <button
                        type="submit"
                        class="btn btn-dark w-100">

                        Create Account

                    </button>

                </form>


                <p class="text-center mt-3">

                    Already have an account?

                    <a href="/login">
                        Login
                    </a>

                </p>

            </div>

        </div>

    </div>

</div>

{% endblock %}
